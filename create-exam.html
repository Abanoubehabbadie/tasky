<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Exam — Tasky</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Create Exam</h1>

    <form id="exam-form">
      <label>Exam Title
        <input type="text" id="exam-title" required>
      </label>

      <label>Exam Description
        <textarea id="exam-desc" rows="3"></textarea>
      </label>

      <label>Duration (minutes)
        <input type="number" id="exam-duration" min="1" value="60">
      </label>

      <label>Total Marks
        <input type="number" id="exam-marks" min="1" value="100">
      </label>

      <div class="questions-header">
        <h2>Questions</h2>
        <button type="button" id="add-question" class="btn small">Add Question</button>
      </div>

      <div id="questions"></div>

      <div class="form-actions">
        <button type="submit" class="btn primary">Save Exam</button>
        <button type="button" id="preview" class="btn">Preview JSON</button>
      </div>
    </form>

    <pre id="output" class="output" hidden></pre>
  </main>

  <script src="assets/js/create-exam.js"></script>
</body>
</html>
